name: ctf7-factordb

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ctf7-factordb.yml'

jobs:
  query:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Query public factor/search databases
        env:
          N: ''
        run: |
          set -x
          curl -L --fail --max-time 60 --retry 2 "https://factordb.com/api?query=${N}" | tee /tmp/factordb.json || true
          echo
          curl -L --fail --max-time 60 --retry 2 'https://grep.app/api/search?q=e505004fb5d34eb7' | tee /tmp/grepapp.json || true
          echo
          cat /tmp/factordb.json /tmp/grepapp.json 2>/dev/null || true
